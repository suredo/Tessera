# T11, tutor bookings (docs/testing/app-catalogue.md), in its M4 form: a booking sheet checked by
# the scheduling profile (VER-03) before it opens, its slots by the host's clock (RUN-07). The
# request gives one booking (João on Monday at 3 pm). The person books a second student with the
# sheet's own controls (EVAL-01), asks in words to move João to Thursday at 4 pm, a change to the
# data and not the tool, and finds it as they left it the next day. Whether a slot is ever
# double-booked, and how a taken slot is answered, is the AI review's.
id: T11-tutor-bookings
tier: advanced
language: en
person: "A tutor who teaches after school"
goal: "Book students into one-hour slots, Monday to Thursday afternoons, never two in one slot"
clock: { start: "2026-11-09T10:00:00", zone: "Europe/Lisbon" }
budget: { calls: 8 }
profiles: [scheduling]
steps:
  - say: "A booking sheet for my tutoring: Monday to Thursday 2–7 pm, one-hour sessions, never double-booked. João already has Monday at 3 pm."
    expect: { created: true, workspace: new }
  - do: { fill: task-name, value: Maria }
  - do: { click: task-add }
    expect: { version: unchanged, data: changed }
  # A change to the data the sheet keeps, not to the sheet.
  - say: "Move João to Thursday at 4 pm."
    expect: { version: unchanged, data: changed }
  - next-day: true
    expect: { workspace: same, version: unchanged, data: unchanged }
review:
  - fulfilment
  - useful-at-first-sight
  - standard-style
  - controls-work
  - accessibility
  - messages
  - code-red-flags
  - coherence
