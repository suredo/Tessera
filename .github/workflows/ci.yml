# Docs: docs/code/ci/workflow.md
# CI on every pull request and on main (ENG-02): the OKF check and its tests (ENG-05, ENG-08, ENG-24),
# the merge-ready job that stays red while a task handoff is left (ENG-25), and the workspace's
# typecheck, lint, format check, unit tests (ENG-04, TEST-01), secret scan, with the same rules
# as the pre-commit hook (ENG-19), the web app's build, and the coverage report (ENG-17), all on
# Linux; then one Windows job for the OKF check's tests, the platform helpers, the SQLite storage,
# the launcher and local server, and the browser tests (PLAT-01, DATA-01, PLAT-02, SEC-03, TEST-06,
# RUN-06). No secrets and no model calls.
name: CI

on:
  pull_request:
    # edited: a changed description can add or remove a "No doc change needed" line.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  okf:
    name: OKF check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the drift check diffs against the pull request's base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile # the check reads YAML and TypeScript
      - name: Checker tests
        run: node --test scripts/okf-check.test.mjs
      - name: OKF check, with the drift check against the base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/okf-check.mjs --base "origin/$BASE_REF" --pr-body "$RUNNER_TEMP/pr-body.md"
      # On main, the pull request already ran the drift check with its description.
      - name: OKF check
        if: github.event_name == 'push'
        run: node scripts/okf-check.mjs

  merge-ready:
    name: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: No task handoff left (ENG-25)
        run: node scripts/okf-check.mjs --merge-ready

  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # each check reports on its own
      matrix:
        # coverage writes the requirement and lesson report to the job summary (ENG-17).
        check: [typecheck, lint, "format:check", test, secrets, build, coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.check }}

  # Windows (ENG-02): the OKF check's tests, which handle paths and line endings, and the platform
  # helpers', launcher's and local server's tests in one job; the browser tests in the preinstalled
  # Chrome, split across three jobs that run at once (A56). Windows runners are slower, so the fast
  # checks stay above.
  windows-platform:
    name: Windows platform
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # A Windows-only failure in them reached review in pull request 41.
      - name: Checker tests (ENG-08, ENG-24)
        run: node --test scripts/okf-check.test.mjs
      - name: Platform helpers, SQLite storage, launcher and local server (PLAT-01, DATA-01, PLAT-02, SEC-03)
        run: pnpm exec vitest run packages/server/test/platform.test.ts packages/server/test/storage.test.ts packages/server/test/launcher.test.ts packages/server/test/local-server.test.ts

  windows-browser:
    name: Windows browser tests (${{ matrix.shard }} of 3)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # each part reports on its own
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # TEMPORARY DIAGNOSTIC (#302): catch the 320 px overflow in the filtering check.
      - name: TEMPORARY repeat of the filtering check
        if: matrix.shard == 2
        continue-on-error: true
        run: pnpm exec playwright test --project=chrome-1280 --repeat-each=15 packages/web/e2e/filtering-check.spec.ts packages/web/e2e/form-check.spec.ts
      - name: Browser tests in Chrome (TEST-06)
        run: pnpm e2e --shard=${{ matrix.shard }}/3
      # No videos on CI (A56): a failed test's light trace is kept, and the owner records a video
      # locally when one is needed.
      - name: Keep the traces of failed tests (ENG-10)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-output/playwright/
          retention-days: 14

  # The one name the ruleset on main requires for Windows (ENG-15): it passes only when the
  # platform job and every part of the browser tests passed, so a new part needs no ruleset change.
  windows:
    name: Windows (platform and Chrome)
    needs: [windows-platform, windows-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows job passed
        env:
          PLATFORM: ${{ needs.windows-platform.result }}
          BROWSER: ${{ needs.windows-browser.result }}
        run: |
          echo "Platform: $PLATFORM. Browser tests: $BROWSER."
          test "$PLATFORM" = success && test "$BROWSER" = success
