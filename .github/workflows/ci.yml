# CI on every pull request and on main (ENG-02): the OKF check and its tests (ENG-05, ENG-08, ENG-24),
# the merge-ready job that stays red while a task handoff is left (ENG-25), and the workspace's
# typecheck, lint, format check, unit tests (ENG-04, TEST-01), secret scan, with the same rules
# as the pre-commit hook (ENG-19), and the web app's build, all on Linux; then one Windows job for
# the platform helpers and the browser tests (PLAT-01, TEST-06). No secrets and no model calls.
name: CI

on:
  pull_request:
    # edited: a changed description can add or remove a "No doc change needed" line.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  okf:
    name: OKF check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the drift check diffs against the pull request's base
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile # the check reads YAML and TypeScript
      - name: Checker tests
        run: node --test scripts/okf-check.test.mjs
      - name: OKF check, with the drift check against the base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/okf-check.mjs --base "origin/$BASE_REF" --pr-body "$RUNNER_TEMP/pr-body.md"
      # On main, the pull request already ran the drift check with its description.
      - name: OKF check
        if: github.event_name == 'push'
        run: node scripts/okf-check.mjs

  merge-ready:
    name: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: No task handoff left (ENG-25)
        run: node scripts/okf-check.mjs --merge-ready

  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # each check reports on its own
      matrix:
        check: [typecheck, lint, "format:check", test, secrets, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.check }}

  # The one Windows job (ENG-02): the platform helpers' tests and the browser tests in Chrome and
  # Edge, both preinstalled on the runner. Windows minutes cost more, so the fast checks stay above.
  windows:
    name: Windows (platform, Chrome and Edge)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm from packageManager, through Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Platform helpers (PLAT-01)
        run: pnpm exec vitest run packages/server/test/platform.test.ts
      - name: Playwright's video encoder
        run: pnpm exec playwright install ffmpeg
      - name: Browser tests in Chrome and Edge (TEST-06)
        run: pnpm e2e
      - name: Keep the videos (ENG-10)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-videos
          path: test-output/playwright/
          retention-days: 14
